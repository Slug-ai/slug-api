[project]
name = "slug-api"
version = "0.1.0"
description = "OpenAI-compatible API in front of Slug's inference backends"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # file uploads
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.28", "openai>=1.60", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
